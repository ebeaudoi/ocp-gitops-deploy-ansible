apiVersion: aap.ansible.com/v1alpha1
kind: AnsibleAutomationPlatform
metadata:
  name: aap
  namespace: ansible-automation-platform
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  image_pull_policy: IfNotPresent

  # Components
  controller:
    disabled: false
  eda:
    disabled: false
  # Hub: disabled in base (lab uses RWO thin-csi; Hub file storage needs RWX).
  # Enable via overlay only with RWX StorageClass or storage_type: S3 / azure.
  hub:
    disabled: true
    storage_type: file
    file_storage_storage_class: patch-me-see-overlays-dir
    file_storage_size: 10Gi
    ## S3 example (also set disabled: false in the overlay):
    # storage_type: S3
    # object_storage_s3_secret: aap-hub-s3
    ## Azure example:
    # storage_type: azure
    # object_storage_azure_secret: azure-secret-name
  lightspeed:
    disabled: true

  # Schedule platform workloads on infra nodes
  node_selector:
    node-role.kubernetes.io/infra: ""
  tolerations:
    - key: node-role.kubernetes.io/infra
      operator: Exists
      effect: NoSchedule
    - key: node-role.kubernetes.io/infra
      operator: Exists
      effect: NoExecute
