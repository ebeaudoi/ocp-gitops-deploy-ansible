apiVersion: aap.ansible.com/v1alpha1
kind: AnsibleAutomationPlatform
metadata:
  name: aap
  namespace: ansible-automation-platform
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  image_pull_policy: IfNotPresent

  # Components
  controller:
    disabled: false
  eda:
    disabled: false
  # Hub: disabled in base (lab uses RWO thin-csi; Hub file storage needs RWX).
  # Overlay / update-values.sh sets storage_type (file|S3) and related fields.
  hub:
    disabled: true
    storage_type: file
    file_storage_storage_class: patch-me-see-overlays-dir
    file_storage_size: 10Gi
    # Required when storage_type is S3 (Secret created out-of-band in this namespace)
    object_storage_s3_secret: patch-me-see-overlays-dir
  lightspeed:
    disabled: true

  # Schedule platform workloads on infra nodes
  node_selector:
    node-role.kubernetes.io/infra: ""
  tolerations:
    - key: node-role.kubernetes.io/infra
      operator: Exists
      effect: NoSchedule
    - key: node-role.kubernetes.io/infra
      operator: Exists
      effect: NoExecute
