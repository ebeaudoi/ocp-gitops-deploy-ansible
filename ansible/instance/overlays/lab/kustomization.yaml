apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - hub-s3-secret.yaml

patches:
  - target:
      kind: AnsibleAutomationPlatform
      name: aap
    patch: |-
      # Hub storage: use storage_type file (needs RWX class) or S3 (needs Secret).
      # Edit via ansible/update-values.sh — do not leave Hub enabled on thin-csi/file.
      - op: replace
        path: /spec/hub/disabled
        value: false
      - op: replace
        path: /spec/hub/storage_type
        value: S3
      - op: replace
        path: /spec/hub/file_storage_storage_class
        value: thin-csi
      - op: replace
        path: /spec/hub/object_storage_s3_secret
        value: aap-hub-s3
