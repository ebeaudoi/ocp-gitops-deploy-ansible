apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - target:
      kind: AnsibleAutomationPlatform
      name: aap
    patch: |-
      # thin-csi is RWO; Hub file storage requires RWX. Disable Hub until
      # an RWX StorageClass or object storage (S3/Azure) is available.
      - op: replace
        path: /spec/hub/disabled
        value: true
      - op: replace
        path: /spec/hub/file_storage_storage_class
        value: thin-csi
