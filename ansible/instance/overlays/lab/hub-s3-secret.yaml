# Hub object-storage Secret (referenced by spec.hub.object_storage_s3_secret).
# Values are patched by ansible/update-values.sh — do not commit real credentials.
apiVersion: v1
kind: Secret
metadata:
  name: aap-hub-s3
  namespace: ansible-automation-platform
type: Opaque
stringData:
  s3-access-key-id: s4admin
  s3-secret-access-key: s4secret
  s3-bucket-name: aap-hub-s3
  s3-region: us-east-1
  s3-endpoint: http://s4.s4.svc:7480
