# Hub object-storage Secret (referenced by spec.hub.object_storage_s3_secret).
# Values are patched by ansible/update-values.sh — do not commit real credentials.
apiVersion: v1
kind: Secret
metadata:
  name: aap-hub-s3
  namespace: ansible-automation-platform
type: Opaque
stringData:
  s3-access-key-id: CHANGE_ME
  s3-secret-access-key: CHANGE_ME
  s3-bucket-name: CHANGE_ME
  s3-region: CHANGE_ME
  s3-endpoint: CHANGE_ME
