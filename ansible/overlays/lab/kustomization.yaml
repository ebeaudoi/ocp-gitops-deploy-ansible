# Full AAP lab stack: operator + AnsibleAutomationPlatform instance.
#
# First-time install: apply operator, wait for CSV Succeeded, then apply instance
# (CRDs appear only after the operator is ready). Day-2 re-apply can use this umbrella.
#
#   oc apply -k ansible/operator/overlays/lab/
#   oc wait csv -n ansible-automation-platform -l operators.coreos.com/ansible-automation-platform-operator.ansible-automation-platform --for=jsonpath='{.status.phase}'=Succeeded --timeout=600s
#   oc apply -k ansible/instance/overlays/lab/
#
# Or day-2:
#   oc apply -k ansible/overlays/lab/
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../operator/overlays/lab
  - ../../instance/overlays/lab
