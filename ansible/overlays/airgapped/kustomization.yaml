# Full AAP stack for air-gapped clusters: operator + AnsibleAutomationPlatform instance.
#
# First-time install: apply operator, approve InstallPlan, wait for CSV Succeeded,
# then apply instance. Day-2 re-apply can use this umbrella.
#
#   oc apply -k ansible/operator/overlays/airgapped/
#   # approve InstallPlan, then:
#   oc wait csv -n ansible-automation-platform -l operators.coreos.com/ansible-automation-platform-operator.ansible-automation-platform --for=jsonpath='{.status.phase}'=Succeeded --timeout=600s
#   oc apply -k ansible/instance/overlays/airgapped/
#
# Or day-2:
#   oc apply -k ansible/overlays/airgapped/
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../operator/overlays/airgapped
  - ../../instance/overlays/airgapped
