apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - target:
      kind: Subscription
      name: .*
    patch: |-
      - op: replace
        path: /spec/channel
        value: stable-2.7
      - op: replace
        path: /spec/source
        value: redhat-operators
