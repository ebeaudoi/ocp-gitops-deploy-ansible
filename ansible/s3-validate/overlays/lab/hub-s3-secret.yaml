# Copy of Hub S3 Secret for the aap-s3-validate Job (namespace overridden to s4).
# Kept in sync by ansible/update-values.sh — do not commit real credentials.
apiVersion: v1
kind: Secret
metadata:
  name: aap-hub-s3
  namespace: s4
type: Opaque
stringData:
  s3-access-key-id: s4admin
  s3-secret-access-key: s4secret
  s3-bucket-name: aap-hub-s3
  s3-region: us-east-1
  s3-endpoint: http://s4.s4.svc:7480
