apiVersion: batch/v1
kind: Job
metadata:
  name: aap-s3-validate
  namespace: s4
  labels:
    app.kubernetes.io/name: aap-s3-validate
  annotations:
    # Force recreate on each Argo sync so the test re-runs
    argocd.argoproj.io/sync-options: Force=true,Replace=true
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aap-s3-validate
    spec:
      restartPolicy: Never
      # Do not set runAsUser — OpenShift restricted SCC injects a UID
      # from the namespace range (e.g. 1000730000+).
      securityContext:
        runAsNonRoot: true
        hostUsers: false
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: aws
          image: amazon/aws-cli:2.15.0
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "/scripts/validate-script.sh"]
          env:
            - name: HOME
              value: /tmp
            - name: NO_VERIFY_SSL
              value: "true"
            - name: CREATE_BUCKET
              value: "false"
          volumeMounts:
            - name: creds
              mountPath: /creds
              readOnly: true
            - name: scripts
              mountPath: /scripts
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: creds
          secret:
            secretName: aap-hub-s3
            items:
              - key: s3-access-key-id
                path: s3-access-key-id
              - key: s3-secret-access-key
                path: s3-secret-access-key
              - key: s3-bucket-name
                path: s3-bucket-name
              - key: s3-region
                path: s3-region
              - key: s3-endpoint
                path: s3-endpoint
        - name: scripts
          configMap:
            name: aap-s3-validate-script
            defaultMode: 0755
