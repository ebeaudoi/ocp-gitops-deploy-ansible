apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ansible-operator
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  destination:
    namespace: ansible-automation-platform
    server: https://kubernetes.default.svc
  project: appansible
  source:
    path: ansible/operator/overlays/lab
    repoURL: https://github.com/ebeaudoi/ocp-gitops-deploy-ansible.git
    targetRevision: HEAD
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
