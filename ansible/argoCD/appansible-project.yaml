apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: appansible
  namespace: openshift-gitops
spec:
  description: Ansible Automation Platform (operator + AnsibleAutomationPlatform instance)
  sourceRepos:
    - https://github.com/ebeaudoi/ocp-gitops-deploy-ansible.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: ansible-automation-platform
    - server: https://kubernetes.default.svc
      namespace: openshift-gitops
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
